services:
  # PostgreSQL Database
  - type: postgresql
    name: skill-platform-db
    databaseName: skill_platform
    plan: free
    diskSizeGB: 1
    region: oregon

  # Backend API (FastAPI - Demo Mode)
  - type: web
    name: skill-platform-api
    runtime: python
    buildCommand: pip install fastapi uvicorn pydantic python-jose passlib python-multipart
    startCommand: uvicorn app_demo:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production

  # Frontend (React/Vite Static Site)
  - type: static_site
    name: skill-platform-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
