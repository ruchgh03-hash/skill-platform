services:

  # ==================== BACKEND API (FastAPI - Demo Mode) ====================
  - type: web
    name: skill-platform-api
    runtime: python
    buildCommand: pip install fastapi uvicorn pydantic python-jose passlib python-multipart && python -m spacy download en_core_web_sm
    startCommand: uvicorn app_demo:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /health

  # ==================== FRONTEND (React/Vite Static Site) ====================
  - type: static_site
    name: skill-platform-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html